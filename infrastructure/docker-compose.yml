services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codeforge}
      POSTGRES_USER: ${DB_USERNAME:-codeforge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeforge_local_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-codeforge_user} -d ${DB_NAME:-codeforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
