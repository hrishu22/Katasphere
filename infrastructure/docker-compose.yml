services:
  postgres:
    image: postgres:16-alpine
    container_name: katasphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-katasphere}
      POSTGRES_USER: ${DB_USERNAME:-katasphere_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-katasphere_local_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-katasphere_user} -d ${DB_NAME:-katasphere}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
