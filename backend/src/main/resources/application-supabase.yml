spring:
  datasource:
    # Supabase PostgreSQL Connection String (JDBC format)
    # Example direct: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
    # Example pooler: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
    url: ${SUPABASE_DB_URL:${DB_URL}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.katasphere: INFO
    org.flywaydb: INFO
