spring:
  datasource:
    url: ${SUPABASE_DB_URL:${DATABASE_URL:${DB_URL:${spring.datasource.url}}}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME:${spring.datasource.username:postgres}}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD:${spring.datasource.password:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.katasphere: INFO
    org.flywaydb: INFO
