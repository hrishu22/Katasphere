spring:
  datasource:
    url: ${DATABASE_URL:${DB_URL:${SUPABASE_DB_URL:${spring.datasource.url}}}}
    username: ${DB_USERNAME:${SUPABASE_DB_USERNAME:${spring.datasource.username:postgres}}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD:${spring.datasource.password:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.katasphere: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
